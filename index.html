<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Akan Name Generator</h1>
    <p>Enter your birth date and gender to discover your Akan name!</p>

    <input type="number" id="day" placeholder="Day" />
    <input type="number" id="month" placeholder="Month" />
    <input type="number" id="year" placeholder="Year" />

    <select id="gender">
      <option value="">Select Gender</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>

    <button onclick="getName()">Submit</button>

    <p id="result"></p>

    <script src="code.js"></script>
  </body>
</html>
